<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lucerito & Angel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#07030a;
    --bg-1:#150a1c;
    --glow-core:#fff3ee;
    --glow-pink:#ff8fae;
    --aurora-a:#ff8fae;
    --aurora-b:#b98cff;
    --aurora-c:#6ee7d0;
    --rose:#ffb7c9;
    --mauve:#c99aab;
    --mauve-dim:#8a6270;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{
    min-height:100%;
    background:var(--bg-0);
  }

  body{
    font-family:'Manrope',sans-serif;
    color:var(--rose);
    position:relative;
    overflow-x:hidden;
  }

  .frame{
    position:fixed;
    inset:10px;
    border:1px solid rgba(255,183,201,0.22);
    border-radius:22px;
    z-index:5;
    pointer-events:none;
  }
  .frame::before, .frame::after{
    content:"";
    position:absolute;
    width:16px; height:16px;
    border:1px solid rgba(255,183,201,0.55);
  }
  .frame::before{ top:-1px; left:-1px; border-right:none; border-bottom:none; border-top-left-radius:12px; }
  .frame::after{ bottom:-1px; right:-1px; border-left:none; border-top:none; border-bottom-right-radius:12px; }

  .backdrop{
    position:fixed;
    inset:0;
    z-index:0;
    background:linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 100%);
    overflow:hidden;
  }

  .aurora{
    position:absolute;
    inset:-20%;
    filter:blur(40px);
    opacity:0.55;
    mix-blend-mode:screen;
    background:
      radial-gradient(45% 30% at 20% 25%, var(--aurora-a), transparent 70%),
      radial-gradient(40% 28% at 80% 20%, var(--aurora-b), transparent 70%),
      radial-gradient(50% 35% at 50% 85%, var(--aurora-c), transparent 70%);
    animation:auroraShift 16s ease-in-out infinite alternate;
  }

  @keyframes auroraShift{
    0%{ transform:translate(-3%, -2%) rotate(0deg) scale(1); }
    100%{ transform:translate(3%, 2%) rotate(6deg) scale(1.08); }
  }

  canvas#stars-near, canvas#stars-far{
    position:fixed;
    inset:0;
    z-index:1;
  }

  .idbar{
    position:relative;
    z-index:6;
    display:flex;
    align-items:center;
    gap:12px;
    padding:26px 24px 0 26px;
  }

  .avatar{
    width:52px; height:52px;
    border-radius:50%;
    background-image:url('mylu.png');
    background-size:cover;
    background-position:center;
    border:1.5px solid rgba(255,235,230,0.55);
    box-shadow:0 0 18px rgba(255,143,174,0.4);
    flex-shrink:0;
  }

  .idbar .names{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:1.3rem;
    color:var(--glow-core);
    text-shadow:0 0 14px rgba(255,180,200,0.4);
  }

  .idbar .names .amp{
    font-style:italic;
    color:var(--glow-pink);
    margin:0 0.12em;
    font-weight:400;
  }

  .notes{
    position:relative;
    z-index:6;
    display:flex;
    gap:12px;
    overflow-x:auto;
    padding:18px 24px 4px 26px;
    scrollbar-width:none;
  }
  .notes::-webkit-scrollbar{ display:none; }

  .note{
    flex:0 0 auto;
    width:150px;
    padding:14px 14px 16px;
    border-radius:14px;
    background:rgba(255,143,174,0.06);
    border:1px solid rgba(255,183,201,0.22);
    font-family:'Cormorant Garamond', serif;
    font-size:0.98rem;
    font-style:italic;
    line-height:1.35;
    color:var(--glow-core);
  }
  .note:nth-child(2n){ transform:rotate(-1.2deg); }
  .note:nth-child(2n+1){ transform:rotate(1deg); }

  .stage{
    position:relative;
    z-index:6;
    width:100%;
    max-width:520px;
    margin:0 auto;
    padding:5vh 24px 6vh;
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:clamp(16px, 3.5vh, 28px);
  }

  .since{
    font-size:0.7rem;
    letter-spacing:0.16em;
    color:var(--mauve-dim);
    text-transform:uppercase;
  }

  .portal-wrap{
    position:relative;
    width:min(56vw, 230px);
    height:min(56vw, 230px);
    display:flex;
    align-items:center;
    justify-content:center;
    perspective:900px;
  }

  .portal-glow{
    position:absolute;
    inset:-30%;
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,235,230,0.85) 0%, rgba(255,143,174,0.32) 38%, transparent 68%);
    filter:blur(6px);
    animation:breathe 5.5s ease-in-out infinite;
  }

  @keyframes breathe{
    0%,100%{ transform:scale(0.94); opacity:0.85; }
    50%{ transform:scale(1.05); opacity:1; }
  }

  .portal-ring{
    position:absolute;
    inset:0;
    border-radius:50%;
    border:1px solid rgba(255,183,201,0.25);
  }

  .heart-core{
    position:relative;
    width:42%;
    height:42%;
    z-index:2;
    filter:drop-shadow(0 0 24px rgba(255,190,205,0.85));
    animation:spin3d 9s linear infinite;
  }

  @keyframes spin3d{
    from{ transform:rotateY(0deg); }
    to{ transform:rotateY(360deg); }
  }

  .heart-core svg{ width:100%; height:100%; display:block; }

  .orbit{
    position:absolute;
    inset:0;
    border-radius:50%;
    animation:spin 22s linear infinite;
  }
  .orbit.slow{ animation-duration:34s; animation-direction:reverse; }

  .orbit i{
    position:absolute;
    width:3px; height:3px;
    background:var(--rose);
    border-radius:1px;
    box-shadow:0 0 6px 1px rgba(255,183,201,0.8);
  }

  @keyframes spin{
    from{ transform:rotate(0deg); }
    to{ transform:rotate(360deg); }
  }

  .counter{
    display:flex;
    gap:clamp(10px, 3vw, 22px);
  }

  .counter .unit{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    min-width:52px;
  }

  .counter .num{
    font-family:'Cormorant Garamond', serif;
    font-size:clamp(1.4rem, 5.5vw, 1.9rem);
    color:var(--glow-core);
    text-shadow:0 0 14px rgba(255,180,200,0.45);
    font-variant-numeric:tabular-nums;
  }

  .counter .lbl{
    font-size:0.6rem;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--mauve-dim);
  }

  .surprise-btn{
    appearance:none;
    border:1px solid rgba(255,183,201,0.4);
    background:rgba(255,143,174,0.08);
    color:var(--rose);
    font-family:'Manrope',sans-serif;
    font-size:0.82rem;
    letter-spacing:0.04em;
    padding:11px 26px;
    border-radius:999px;
    cursor:pointer;
    transition:background 0.25s ease, transform 0.15s ease, border-color 0.25s ease;
  }
  .surprise-btn:hover{ background:rgba(255,143,174,0.16); border-color:rgba(255,183,201,0.7); }
  .surprise-btn:active{ transform:scale(0.97); }

  .reveal{
    position:fixed;
    inset:0;
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:28px;
    background:rgba(6,3,5,0.72);
    backdrop-filter:blur(6px);
    opacity:0;
    pointer-events:none;
    transition:opacity 0.4s ease;
  }
  .reveal.open{ opacity:1; pointer-events:auto; }

  .reveal-card{
    max-width:400px;
    text-align:center;
    padding:34px 28px;
    border-radius:18px;
    background:linear-gradient(180deg, rgba(30,12,20,0.9), rgba(15,6,10,0.9));
    border:1px solid rgba(255,183,201,0.25);
    box-shadow:0 0 60px rgba(255,143,174,0.18);
    transform:translateY(14px) scale(0.98);
    transition:transform 0.4s ease;
  }
  .reveal.open .reveal-card{ transform:translateY(0) scale(1); }

  .reveal-card p{
    font-family:'Cormorant Garamond', serif;
    font-size:1.35rem;
    line-height:1.5;
    color:var(--glow-core);
    font-style:italic;
  }

  .reveal-close{
    margin-top:22px;
    background:none;
    border:none;
    color:var(--mauve-dim);
    font-size:0.72rem;
    letter-spacing:0.1em;
    text-transform:uppercase;
    cursor:pointer;
  }

  .burst-heart{
    position:fixed;
    z-index:15;
    pointer-events:none;
    font-size:14px;
    color:var(--rose);
    opacity:0.9;
    animation:floatUp 1.6s ease-out forwards;
  }
  @keyframes floatUp{
    to{ transform:translateY(-120px) scale(1.4); opacity:0; }
  }

  .player{
    position:fixed;
    right:22px;
    bottom:22px;
    z-index:7;
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 14px 8px 10px;
    border-radius:999px;
    background:rgba(20,8,14,0.55);
    border:1px solid rgba(255,183,201,0.3);
    backdrop-filter:blur(6px);
  }

  .player button{
    width:30px; height:30px;
    border-radius:50%;
    border:1px solid rgba(255,183,201,0.4);
    background:rgba(255,143,174,0.12);
    color:var(--rose);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-size:0.75rem;
  }

  .player span{
    font-size:0.66rem;
    letter-spacing:0.06em;
    color:var(--mauve-dim);
    text-transform:uppercase;
  }

  @media (max-height:700px){
    .stage{ gap:14px; padding:3vh 20px; }
    .notes{ padding-top:12px; }
  }
</style>
</head>
<body>

<div class="backdrop">
  <div class="aurora"></div>
</div>
<canvas id="stars-far"></canvas>
<canvas id="stars-near"></canvas>
<div class="frame"></div>

<div class="idbar">
  <div class="avatar"></div>
  <div class="names">Lucerito<span class="amp">&</span>Angel</div>
</div>

<div class="notes">
  <div class="note">Amo tu carita bonita, en especial tus cachetitos.</div>
  <div class="note">Amo lo mucho que amas los tulipanes.</div>
  <div class="note">Amo cómo te dedicas a tus estudios de derecho, serás una abogada increíble.</div>
  <div class="note">Amo, simplemente, que seas tú.</div>
</div>

<main class="stage">
  <div class="since">Juntos desde el 23 de febrero de 2025</div>

  <div class="portal-wrap">
    <div class="portal-glow"></div>
    <div class="portal-ring"></div>
    <div class="orbit" id="orbitA"></div>
    <div class="orbit slow" id="orbitB"></div>
    <div class="heart-core">
      <svg viewBox="0 0 100 90" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="heartGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#fff6f2"/>
            <stop offset="55%" stop-color="#ffb7c9"/>
            <stop offset="100%" stop-color="#ff8fae"/>
          </linearGradient>
        </defs>
        <path d="M50 86 C20 62, 4 42, 4 24 C4 8, 18 -2, 32 4 C42 8, 50 20, 50 20 C50 20, 58 8, 68 4 C82 -2, 96 8, 96 24 C96 42, 80 62, 50 86 Z"
          fill="url(#heartGrad)"/>
      </svg>
    </div>
  </div>

  <div class="counter" id="counter">
    <div class="unit"><span class="num" id="d">0</span><span class="lbl">Días</span></div>
    <div class="unit"><span class="num" id="h">0</span><span class="lbl">Horas</span></div>
    <div class="unit"><span class="num" id="m">0</span><span class="lbl">Min</span></div>
    <div class="unit"><span class="num" id="s">0</span><span class="lbl">Seg</span></div>
  </div>

  <button class="surprise-btn" id="surpriseBtn">toca aquí ✦</button>
</main>

<div class="reveal" id="reveal">
  <div class="reveal-card">
    <p id="revealText"></p>
    <button class="reveal-close" id="revealClose">cerrar</button>
  </div>
</div>

<div class="player">
  <button id="playBtn">▶</button>
  <span>nuestra canción</span>
  <audio id="song" src="amor.m4a" loop></audio>
</div>

<script>
  const startDate = new Date("2025-02-23T00:00:00");
  function pad(n){ return String(n).padStart(2,"0"); }
  function updateCounter(){
    const now = new Date();
    let diff = Math.max(0, now - startDate);
    const totalSeconds = Math.floor(diff/1000);
    const days = Math.floor(totalSeconds / 86400);
    const hours = Math.floor((totalSeconds % 86400) / 3600);
    const mins = Math.floor((totalSeconds % 3600) / 60);
    const secs = totalSeconds % 60;
    document.getElementById("d").textContent = days;
    document.getElementById("h").textContent = pad(hours);
    document.getElementById("m").textContent = pad(mins);
    document.getElementById("s").textContent = pad(secs);
  }
  updateCounter();
  setInterval(updateCounter, 1000);

  const messages = [
    "Cada día contigo se siente como el primero. Te amo, Lucerito.",
    "De todas las personas que pude encontrar en este mundo, me alegra que hayas sido tú.",
    "Gracias por quedarte, por reír conmigo y por hacer que todo tenga más sentido.",
    "No importa cuánto tiempo pase, contigo siempre quiero sumar un día más."
  ];
  const reveal = document.getElementById("reveal");
  const revealText = document.getElementById("revealText");
  const surpriseBtn = document.getElementById("surpriseBtn");
  const revealClose = document.getElementById("revealClose");

  surpriseBtn.addEventListener("click", () => {
    revealText.textContent = messages[Math.floor(Math.random()*messages.length)];
    reveal.classList.add("open");
    burstHearts(surpriseBtn);
  });
  revealClose.addEventListener("click", () => reveal.classList.remove("open"));
  reveal.addEventListener("click", (e) => { if(e.target === reveal) reveal.classList.remove("open"); });

  function burstHearts(originEl){
    const rect = originEl.getBoundingClientRect();
    const cx = rect.left + rect.width/2;
    const cy = rect.top + rect.height/2;
    for(let i=0;i<10;i++){
      const h = document.createElement("div");
      h.className = "burst-heart";
      h.textContent = "♥";
      h.style.left = (cx + (Math.random()-0.5)*60) + "px";
      h.style.top = (cy + (Math.random()-0.5)*20) + "px";
      document.body.appendChild(h);
      setTimeout(()=>h.remove(), 1700);
    }
  }

  document.body.addEventListener("click", (e) => {
    if(e.target.closest(".surprise-btn, .player, .reveal")) return;
    const h = document.createElement("div");
    h.className = "burst-heart";
    h.textContent = "♥";
    h.style.left = e.clientX + "px";
    h.style.top = e.clientY + "px";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(), 1700);
  });

  const song = document.getElementById("song");
  const playBtn = document.getElementById("playBtn");
  let playing = false;
  playBtn.addEventListener("click", () => {
    if(!playing){
      song.play().catch(()=>{});
      playBtn.textContent = "❚❚";
    } else {
      song.pause();
      playBtn.textContent = "▶";
    }
    playing = !playing;
  });

  function buildOrbit(id, count, radiusPct){
    const el = document.getElementById(id);
    for(let i=0;i<count;i++){
      const dot = document.createElement("i");
      const angle = (360/count)*i;
      dot.style.left = "50%";
      dot.style.top = "50%";
      dot.style.transform = `rotate(${angle}deg) translate(${radiusPct}%) rotate(-${angle}deg)`;
      el.appendChild(dot);
    }
  }
  buildOrbit("orbitA", 10, 62);
  buildOrbit("orbitB", 7, 78);

  function makeField(canvasId, density, speedMin, speedMax, sizeMin, sizeMax, alphaMax){
    const canvas = document.getElementById(canvasId);
    const ctx = canvas.getContext("2d");
    let W, H, particles = [];

    function resize(){
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
      initParticles();
    }

    function initParticles(){
      particles = [];
      const count = Math.floor((W*H)/density);
      for(let i=0;i<count;i++){
        particles.push({
          x: Math.random()*W,
          y: Math.random()*H,
          r: Math.random()*(sizeMax-sizeMin)+sizeMin,
          speed: Math.random()*(speedMax-speedMin)+speedMin,
          alpha: Math.random()*alphaMax + 0.1,
          drift: (Math.random()-0.5)*0.12
        });
      }
    }

    window.addEventListener("resize", resize);
    resize();

    function tick(){
      ctx.clearRect(0,0,W,H);
      for(const p of particles){
        p.y -= p.speed;
        p.x += p.drift;
        if(p.y < -5){ p.y = H+5; p.x = Math.random()*W; }
        ctx.fillStyle = `rgba(255,183,201,${p.alpha})`;
        ctx.fillRect(p.x, p.y, p.r, p.r);
      }
      requestAnimationFrame(tick);
    }
    tick();
  }

  makeField("stars-far", 16000, 0.02, 0.08, 1.2, 2.4, 0.35);
  makeField("stars-near", 9000, 0.08, 0.28, 0.4, 1.6, 0.55);
</script>

</body>
</html>
